name: Smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cpu-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install minimal CPU dependencies
        run: |
          python -m pip install numpy==2.0.1
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile Python sources
        run: python -m compileall -q scripts src
      - name: Run both tasks with all baseline models
        run: python scripts/smoke_test.py --synthetic --model all
